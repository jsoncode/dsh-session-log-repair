# CI：push 到 master、PR、手动触发
# - 安装依赖（pnpm frozen-lockfile）→ 语法检查 → 三个冒烟测试
# - 测试脚本自解析宿主包：有 DSH profile 用 profile 的副本，否则用本包 devDependencies，
#   因此在干净的 runner 上也能跑（无需安装 DSH）。
#
# 历史排障记录（勿删）：setup-node@v5 的 package-manager-cache 默认开启，会读取
# package.json 的 packageManager 字段（pnpm@10.34.5）并执行 `pnpm store path` 定位缓存，
# 而该步骤执行时 pnpm 尚未安装（node 26 不捆绑 corepack），于是报
# "Unable to locate executable file: pnpm"。修复：显式 package-manager-cache: false，
# pnpm 由后续步骤用 npx 临时调用。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          # 关闭自动缓存：它会在 pnpm 尚未安装时执行 `pnpm store path` 而失败。
          package-manager-cache: false

      - name: Install dependencies
        # 用 npx 调用 pnpm，版本与 package.json 的 packageManager 字段一致。
        # frozen-lockfile 严格按 pnpm-lock.yaml 安装（lock 已提交）。
        run: npx --yes pnpm@10.34.5 install --frozen-lockfile

      - name: Syntax check
        run: npm run check

      - name: Installer regression test
        run: npm run test:install

      - name: Client-half test
        run: npm run test:client

      - name: Host-half integration test
        run: npm run test:host
