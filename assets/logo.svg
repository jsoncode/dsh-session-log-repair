<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="dsh-session-log-repair">
  <title>dsh-session-log-repair</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#g)" stroke-width="2"/>
  <!-- three stacked log rows, the middle one repaired -->
  <rect x="14" y="16" width="36" height="5" rx="2.5" fill="#64748b"/>
  <rect x="14" y="27" width="22" height="5" rx="2.5" fill="url(#g)"/>
  <rect x="40" y="27" width="10" height="5" rx="2.5" fill="#64748b" opacity=".45"/>
  <rect x="14" y="38" width="36" height="5" rx="2.5" fill="#64748b"/>
  <!-- repair check -->
  <path d="M23 52.5 28.5 58 41 45.5" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
